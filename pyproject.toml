[project]
name = "kafka-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.15.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyrefly>=1.2.0",
    "ruff>=0.16.6",
    "uvicorn[standard]>=0.52.4",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]


[dependency-groups]
dev = [
    "types-psycopg2>=2.9.21.20260724",
]
